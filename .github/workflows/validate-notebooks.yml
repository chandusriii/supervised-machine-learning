name: Validate notebooks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-notebooks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  execute-notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt nbconvert

      - name: Execute all notebooks
        shell: bash
        run: |
          mkdir -p /tmp/executed-notebooks
          while IFS= read -r -d '' notebook; do
            echo "Executing ${notebook}"
            jupyter nbconvert --to notebook --execute "${notebook}" \
              --output "$(basename "${notebook}")" \
              --output-dir /tmp/executed-notebooks \
              --ExecutePreprocessor.timeout=600
          done < <(find Support-Vector-Machines Ensemble-Learning -type f -name '*.ipynb' -print0)
